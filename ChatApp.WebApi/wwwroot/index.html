<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STALK</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --zalo-blue: #0068ff;
            --zalo-blue-soft: #e5efff;
            --zalo-nav: #001a33;
            --zalo-nav-active: #0068ff;
            --text: #081c36;
            --muted: #7589a3;
            --border: #e5e7eb;
            --bg-chat: #f0f2f5;
            --bg-sidebar: #ffffff;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #cfd6dd;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            color: var(--text);
            overflow: hidden;
            height: 100vh;
        }

        .app-shell {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: stretch;
            justify-content: center;
            padding: 12px;
        }

        .chat-app {
            width: min(1280px, 100%);
            height: calc(100vh - 24px);
            background: #fff;
            display: flex;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 26, 51, 0.18);
            position: relative;
        }

        /* ===== LOGIN ===== */
        #loginOverlay {
            position: absolute; inset: 0; z-index: 1000;
            background: linear-gradient(160deg, #e8f1ff 0%, #fff 55%);
            display: flex; align-items: center; justify-content: center;
            transition: opacity .25s;
        }
        .login-box {
            width: 380px; background: #fff; border-radius: 16px;
            padding: 36px 32px; text-align: center;
            box-shadow: 0 12px 40px rgba(0,104,255,.12);
        }
        .login-logo {
            width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px;
            background: var(--zalo-blue); color: #fff;
            display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 800;
        }
        .login-box h2 { margin: 0 0 6px; color: var(--zalo-blue); font-size: 1.6rem; }
        .login-box p { margin: 0 0 22px; color: var(--muted); font-size: .92rem; }
        .login-box input {
            width: 100%; border: 1px solid var(--border); border-radius: 10px;
            padding: 12px 14px; font-size: .95rem; outline: none; margin-bottom: 14px;
        }
        .login-box input:focus { border-color: var(--zalo-blue); box-shadow: 0 0 0 3px rgba(0,104,255,.12); }
        .login-box button {
            width: 100%; border: none; border-radius: 10px; padding: 12px;
            background: var(--zalo-blue); color: #fff; font-weight: 600; font-size: .95rem; cursor: pointer;
        }
        .login-box button:hover { filter: brightness(1.05); }
        #loginError { color: #e11d48; font-size: .85rem; margin-top: 12px; display: none; }

        /* ===== LEFT NAV (Zalo style) ===== */
        .nav-rail {
            width: 64px; background: var(--zalo-nav); display: flex; flex-direction: column;
            align-items: center; padding: 14px 0; flex-shrink: 0;
        }
        .nav-avatar {
            width: 40px; height: 40px; border-radius: 50%; background: #3b82f6;
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-weight: 700; margin-bottom: 18px; font-size: .9rem;
        }
        .nav-item {
            width: 44px; height: 44px; border-radius: 12px; color: #9db2c9;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.15rem; cursor: pointer; margin-bottom: 6px; position: relative;
        }
        .nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
        .nav-item.active { background: var(--zalo-nav-active); color: #fff; }
        .nav-spacer { flex: 1; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 340px; background: var(--bg-sidebar); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; flex-shrink: 0;
        }
        .sidebar-top { padding: 14px 14px 10px; }
        .sidebar-title {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px; padding: 0 4px;
        }
        .sidebar-title h1 { margin: 0; font-size: 1.15rem; font-weight: 700; }
        .sidebar-title .tools { display: flex; gap: 8px; color: var(--muted); }
        .sidebar-title .tools i { cursor: pointer; padding: 6px; border-radius: 8px; }
        .sidebar-title .tools i:hover { background: #f3f4f6; color: var(--zalo-blue); }
        .search-wrap {
            display: flex; align-items: center; gap: 8px; background: #ebecf0;
            border-radius: 20px; padding: 8px 12px;
        }
        .search-wrap i { color: var(--muted); font-size: .85rem; }
        .search-wrap input {
            border: none; background: transparent; outline: none; width: 100%;
            font-size: .9rem; color: var(--text);
        }
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 14px;
            cursor: pointer; border: none; background: transparent; width: 100%; text-align: left;
        }
        .chat-item:hover { background: #f5f6f8; }
        .chat-item.active { background: var(--zalo-blue-soft); }
        .avatar {
            width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #0068ff);
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; flex-shrink: 0;
        }
        .chat-item-info { min-width: 0; flex: 1; }
        .chat-item-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
        .chat-item-info h6 {
            margin: 0; font-size: .95rem; font-weight: 600; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .chat-time { font-size: .72rem; color: var(--muted); flex-shrink: 0; }
        .chat-item-info p {
            margin: 4px 0 0; font-size: .82rem; color: var(--muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* ===== CHAT AREA ===== */
        .chat-area {
            flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); min-width: 0;
            visibility: hidden;
        }
        .chat-area.visible { visibility: visible; }
        .empty-state {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: var(--muted); flex-direction: column; gap: 10px;
        }

        .chat-header {
            height: 68px; background: #fff; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 18px; justify-content: space-between;
            flex-shrink: 0;
        }
        .header-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .header-info h5 { margin: 0; font-size: 1.05rem; font-weight: 650; }
        .header-info .sub { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
        .dot-online { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; }
        .header-actions { display: flex; align-items: center; gap: 4px; }
        .header-actions button {
            width: 40px; height: 40px; border: none; background: transparent; border-radius: 10px;
            color: var(--muted); font-size: 1.15rem; cursor: pointer;
        }
        .header-actions button:hover { background: #f3f4f6; color: var(--zalo-blue); }

        .chat-messages {
            flex: 1; padding: 16px 20px 8px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
        }

        .msg-row {
            display: flex; width: 100%; align-items: flex-end; gap: 8px;
            position: relative;
        }
        .msg-row.me { justify-content: flex-end; }
        .msg-row.other { justify-content: flex-start; }

        .msg-wrap { max-width: min(62%, 520px); display: flex; flex-direction: column; position: relative; }
        .msg-row.me .msg-wrap { align-items: flex-end; }
        .msg-row.other .msg-wrap { align-items: flex-start; }

        .bubble {
            padding: 10px 12px 8px; border-radius: 12px; font-size: .94rem; line-height: 1.45;
            position: relative; word-break: break-word;
            box-shadow: 0 1px 1px rgba(0,0,0,.04);
        }
        .msg-row.me .bubble {
            background: var(--zalo-blue-soft); color: var(--text);
            border-bottom-right-radius: 4px;
        }
        .msg-row.other .bubble {
            background: #fff; color: var(--text);
            border-bottom-left-radius: 4px;
        }
        .bubble.deleted {
            background: transparent !important; box-shadow: none;
            color: var(--muted); font-style: italic; font-size: .88rem; padding: 6px 0;
        }

        .msg-meta {
            display: flex; align-items: center; gap: 6px; margin-top: 4px;
            font-size: .7rem; color: var(--muted);
        }
        .msg-row.me .msg-meta { justify-content: flex-end; }
        .edited-tag { font-style: italic; }
        .pin-tag { color: var(--zalo-blue); }
        .status-pill {
            display: inline-flex; align-items: center; gap: 4px;
            background: #e8eaed; color: var(--muted);
            border-radius: 999px; padding: 2px 8px; font-size: .68rem;
        }
        .status-pill i { font-size: .65rem; color: var(--zalo-blue); }

        .reaction-bar {
            display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap;
        }
        .reaction-chip {
            background: #fff; border: 1px solid var(--border); border-radius: 999px;
            padding: 1px 7px; font-size: .78rem; box-shadow: 0 1px 2px rgba(0,0,0,.05);
        }

        /* Hover actions like Zalo */
        .msg-actions {
            display: none; align-items: center; gap: 2px;
            background: #fff; border: 1px solid var(--border); border-radius: 999px;
            padding: 2px; box-shadow: 0 2px 8px rgba(0,0,0,.08);
            position: absolute; top: -14px;
        }
        .msg-row.me .msg-actions { left: -8px; transform: translateX(-100%); }
        .msg-row.other .msg-actions { right: -8px; transform: translateX(100%); }
        .msg-row:hover .msg-actions { display: flex; }
        .msg-actions button {
            width: 28px; height: 28px; border: none; background: transparent; border-radius: 50%;
            color: var(--muted); cursor: pointer; font-size: .78rem;
        }
        .msg-actions button:hover { background: #f3f4f6; color: var(--zalo-blue); }

        .more-menu {
            display: none; position: absolute; top: 32px; z-index: 20;
            background: #fff; border: 1px solid var(--border); border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,.12); min-width: 150px; padding: 6px;
        }
        .msg-row.me .more-menu { right: 0; }
        .msg-row.other .more-menu { left: 0; }
        .more-menu.open { display: block; }
        .more-menu button {
            width: 100%; text-align: left; border: none; background: transparent;
            padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: .85rem; color: var(--text);
        }
        .more-menu button:hover { background: #f3f4f6; }
        .more-menu button.danger { color: #e11d48; }

        .attachment-img {
            max-width: 240px; border-radius: 8px; display: block; margin-bottom: 6px; cursor: pointer;
        }
        .file-chip {
            display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.55);
            border-radius: 8px; padding: 8px 10px; text-decoration: none; color: var(--zalo-blue);
            font-size: .88rem; margin-bottom: 4px;
        }

        /* ===== INPUT (Zalo style) ===== */
        .composer {
            background: #fff; border-top: 1px solid var(--border); flex-shrink: 0;
        }
        .composer-toolbar {
            display: flex; align-items: center; gap: 2px; padding: 8px 12px 0;
        }
        .composer-toolbar button {
            width: 36px; height: 36px; border: none; background: transparent; border-radius: 8px;
            color: #5f6b7a; font-size: 1.05rem; cursor: pointer;
        }
        .composer-toolbar button:hover { background: #f3f4f6; color: var(--zalo-blue); }
        .composer-row {
            display: flex; align-items: center; gap: 8px; padding: 8px 14px 14px;
        }
        .composer-row input {
            flex: 1; border: none; outline: none; font-size: .95rem; padding: 10px 4px;
            background: transparent; color: var(--text);
        }
        .composer-row input::placeholder { color: #9aa8b8; }
        .composer-side {
            display: flex; align-items: center; gap: 4px;
        }
        .composer-side button {
            width: 38px; height: 38px; border: none; background: transparent; border-radius: 10px;
            color: #5f6b7a; font-size: 1.2rem; cursor: pointer;
        }
        .composer-side button:hover { background: #f3f4f6; color: var(--zalo-blue); }
        .btn-like { color: #f5c518 !important; font-size: 1.35rem !important; }
        .btn-send {
            color: var(--zalo-blue) !important; font-size: 1.25rem !important;
            display: none;
        }
        .btn-send.visible { display: inline-flex; }
        .btn-like.hidden { display: none; }

        /* ===== CALL OVERLAY ===== */
        #callOverlay {
            display: none; position: absolute; inset: 0; background: rgba(15, 23, 42, .94);
            z-index: 2000; flex-direction: column; align-items: center; justify-content: center; color: #fff;
        }
        .call-info-box {
            z-index: 10; display: flex; flex-direction: column; align-items: center;
            background: rgba(0,0,0,.45); padding: 28px 36px; border-radius: 16px;
        }
        .call-icon { font-size: 3.2rem; margin-bottom: 14px; animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { transform: scale(.95); } 50% { transform: scale(1.08); } 100% { transform: scale(.95); }
        }
        #remoteVideo {
            position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; display: none;
        }
        #localVideo {
            position: absolute; bottom: 28px; right: 28px; width: 160px; height: 220px; object-fit: cover;
            border-radius: 12px; border: 2px solid #fff; z-index: 5; display: none; background: #000;
        }
        .call-btn {
            border: none; border-radius: 999px; width: 56px; height: 56px; font-size: 1.2rem;
            cursor: pointer; color: #fff;
        }
        .call-btn.accept { background: #22c55e; }
        .call-btn.reject, .call-btn.end { background: #ef4444; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #c9d0d8; border-radius: 999px; }
    </style>
</head>
<body>
<div class="app-shell">
    <div class="chat-app">
        <div id="callOverlay">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="call-info-box">
                <div class="call-icon" id="callIcon"><i class="fa-solid fa-phone"></i></div>
                <h3 id="callStatusText" style="margin:0 0 6px">Đang gọi...</h3>
                <p id="callDetailsText" style="margin:0;opacity:.85">AE Chill</p>
                <div style="margin-top:28px;display:flex;gap:16px" id="callActionButtons"></div>
            </div>
        </div>

        <div id="loginOverlay">
            <div class="login-box">
                <div class="login-logo">S</div>
                <h2>STALK</h2>
                <p>Đăng nhập để tiếp tục trò chuyện</p>
                <input type="text" id="senderId" placeholder="Nhập User ID (Thiên / AE Chill)">
                <button id="btnConnect">Đăng nhập</button>
                <div id="loginError"></div>
            </div>
        </div>

        <aside class="nav-rail">
            <div class="nav-avatar" id="navAvatar">U</div>
            <div class="nav-item active" title="Tin nhắn"><i class="fa-solid fa-comment"></i></div>
            <div class="nav-item" title="Danh bạ"><i class="fa-solid fa-address-book"></i></div>
            <div class="nav-item" title="Công việc"><i class="fa-solid fa-square-check"></i></div>
            <div class="nav-spacer"></div>
            <div class="nav-item" title="Cài đặt"><i class="fa-solid fa-gear"></i></div>
        </aside>

        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-title">
                    <h1>Chat</h1>
                    <div class="tools">
                        <i class="fa-solid fa-user-plus" title="Thêm bạn"></i>
                        <i class="fa-solid fa-pen-to-square" title="Tạo nhóm"></i>
                    </div>
                </div>
                <div class="search-wrap">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Tìm kiếm">
                </div>
            </div>
            <div class="chat-list" id="chatList"></div>
        </aside>

        <main class="chat-area" id="mainChatArea">
            <div class="empty-state" id="emptyState">
                <i class="fa-regular fa-comments" style="font-size:2.4rem;opacity:.35"></i>
                <div>Chọn một hội thoại để bắt đầu</div>
            </div>

            <div id="chatActive" style="display:none;flex-direction:column;height:100%">
                <header class="chat-header">
                    <div class="header-info">
                        <div class="avatar" style="width:42px;height:42px;font-size:1rem"><i class="fa-solid fa-user-group"></i></div>
                        <div style="min-width:0">
                            <h5 id="currentChatTitle">...</h5>
                            <div class="sub"><span class="dot-online"></span> Đang hoạt động</div>
                        </div>
                    </div>
                    <div class="header-actions">
                        <button id="btnCallAudio" title="Gọi thoại"><i class="fa-solid fa-phone"></i></button>
                        <button id="btnCallVideo" title="Gọi video"><i class="fa-solid fa-video"></i></button>
                        <button title="Thêm"><i class="fa-solid fa-ellipsis"></i></button>
                    </div>
                </header>

                <div class="chat-messages" id="messagesList"></div>

                <div class="composer">
                    <div class="composer-toolbar">
                        <button type="button" title="Sticker"><i class="fa-regular fa-face-smile"></i></button>
                        <button type="button" id="btnImage" title="Hình ảnh"><i class="fa-regular fa-image"></i></button>
                        <button type="button" id="btnAttach" title="Đính kèm file"><i class="fa-solid fa-paperclip"></i></button>
                        <button type="button" title="Danh thiếp"><i class="fa-regular fa-address-card"></i></button>
                        <button type="button" title="Chụp màn hình"><i class="fa-solid fa-scissors"></i></button>
                        <button type="button" title="Định dạng"><i class="fa-solid fa-font"></i></button>
                        <button type="button" title="Tin nhắn nhanh"><i class="fa-solid fa-bolt"></i></button>
                    </div>
                    <div class="composer-row">
                        <input type="file" id="fileInput" style="display:none">
                        <input type="file" id="imageInput" accept="image/*" style="display:none">
                        <input type="text" id="txtMessage" placeholder="Nhập @, tin nhắn...">
                        <div class="composer-side">
                            <button type="button" title="Emoji"><i class="fa-regular fa-face-smile"></i></button>
                            <button type="button" class="btn-like" id="btnLike" title="Gửi Like"><i class="fa-solid fa-thumbs-up"></i></button>
                            <button type="button" class="btn-send" id="btnSend" title="Gửi"><i class="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
<script>
    const connection = new signalR.HubConnectionBuilder().withUrl("/chathub").build();
    let currentUserId = "";
    let currentConversationId = "";
    let currentCallId = null;
    let localStream = null;
    let peerConnection = null;
    let callTimerInterval = null;
    let callSeconds = 0;
    let currentCallType = 0;
    let pendingOffer = null;
    let pendingCandidates = [];

    const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    const loginOverlay = document.getElementById("loginOverlay");
    const senderIdInput = document.getElementById("senderId");
    const loginError = document.getElementById("loginError");
    const chatList = document.getElementById("chatList");
    const messagesList = document.getElementById("messagesList");
    const currentChatTitle = document.getElementById("currentChatTitle");
    const mainChatArea = document.getElementById("mainChatArea");
    const chatActive = document.getElementById("chatActive");
    const emptyState = document.getElementById("emptyState");
    const txtMessage = document.getElementById("txtMessage");
    const btnSend = document.getElementById("btnSend");
    const btnLike = document.getElementById("btnLike");
    const fileInput = document.getElementById("fileInput");
    const imageInput = document.getElementById("imageInput");
    const btnAttach = document.getElementById("btnAttach");
    const btnImage = document.getElementById("btnImage");
    const callOverlay = document.getElementById("callOverlay");
    const callStatusText = document.getElementById("callStatusText");
    const callDetailsText = document.getElementById("callDetailsText");
    const callActionButtons = document.getElementById("callActionButtons");
    const callIcon = document.getElementById("callIcon");
    const localVideo = document.getElementById("localVideo");
    const remoteVideo = document.getElementById("remoteVideo");

    function formatTime(date) {
        return new Date(date).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
    function formatDuration(sec) {
        const m = Math.floor(sec / 60).toString().padStart(2, "0");
        const s = (sec % 60).toString().padStart(2, "0");
        return `${m}:${s}`;
    }
    function escapeHtml(str) {
        return String(str ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
    }

    function updateComposerMode() {
        const hasText = txtMessage.value.trim().length > 0;
        btnSend.classList.toggle("visible", hasText);
        btnLike.classList.toggle("hidden", hasText);
    }

    connection.on("ReceiveNewMessage", (messageDto) => {
        if (messageDto.conversationId !== currentConversationId) return;
        upsertMessage(messageDto);
        loadInbox();
    });
    connection.on("MessageEdited", (dto) => { if (dto.conversationId === currentConversationId) upsertMessage(dto); });
    connection.on("MessageDeleted", (dto) => { if (dto.conversationId === currentConversationId) upsertMessage(dto); });
    connection.on("MessagePinned", (dto) => { if (dto.conversationId === currentConversationId) upsertMessage(dto); });
    connection.on("MessageReactionUpdated", (dto) => { if (dto.conversationId === currentConversationId) upsertMessage(dto); });
    connection.on("ErrorMessage", (msg) => alert(msg));

    function closeAllMenus() {
        document.querySelectorAll(".more-menu.open").forEach(m => m.classList.remove("open"));
    }

    function upsertMessage(dto) {
        const existing = document.querySelector(`[data-message-id="${dto.id}"]`);
        const isMe = dto.senderId === currentUserId;
        const row = document.createElement("div");
        row.className = `msg-row ${isMe ? "me" : "other"}`;
        row.dataset.messageId = dto.id;

        if (dto.isDeleted) {
            row.innerHTML = `
                <div class="msg-wrap">
                    <div class="bubble deleted">Tin nhắn đã được thu hồi</div>
                    <div class="msg-meta">${formatTime(dto.createdAt)}</div>
                </div>`;
        } else {
            let mediaHtml = "";
            if (dto.attachmentUrl) {
                const isImage = /\.(jpeg|jpg|gif|png|webp|svg)$/i.test(dto.attachmentUrl);
                mediaHtml = isImage
                    ? `<img src="${escapeHtml(dto.attachmentUrl)}" class="attachment-img" alt="image" onclick="window.open('${escapeHtml(dto.attachmentUrl)}','_blank')">`
                    : `<a class="file-chip" href="${escapeHtml(dto.attachmentUrl)}" target="_blank"><i class="fa-solid fa-file"></i>${escapeHtml(dto.attachmentName || "Tải file")}</a>`;
            }

            const reactions = dto.reactions || [];
            const reactionHtml = reactions.length
                ? `<div class="reaction-bar">${reactions.map(r => `<span class="reaction-chip">${escapeHtml(r.emotion)}</span>`).join("")}</div>`
                : "";

            const metaBits = [
                formatTime(dto.createdAt),
                dto.updatedAt ? `<span class="edited-tag">Đã sửa</span>` : "",
                dto.isPinned ? `<span class="pin-tag"><i class="fa-solid fa-thumbtack"></i> Đã ghim</span>` : "",
                isMe ? `<span class="status-pill"><i class="fa-solid fa-check-double"></i> Đã nhận</span>` : ""
            ].filter(Boolean).join(" · ");

            const moreItems = [
                isMe ? `<button type="button" onclick="editMsg('${dto.id}')"><i class="fa-regular fa-pen-to-square"></i> Chỉnh sửa</button>` : "",
                `<button type="button" onclick="pinMsg('${dto.id}', ${!dto.isPinned})"><i class="fa-solid fa-thumbtack"></i> ${dto.isPinned ? "Bỏ ghim" : "Ghim tin nhắn"}</button>`,
                `<button type="button" onclick="reactMsg('${dto.id}','❤️')">❤️ Thả cảm xúc</button>`,
                `<button type="button" onclick="reactMsg('${dto.id}','👍')">👍 Like</button>`,
                `<button type="button" onclick="reactMsg('${dto.id}','😂')">😂 Haha</button>`,
                isMe ? `<button type="button" class="danger" onclick="deleteMsg('${dto.id}')"><i class="fa-regular fa-trash-can"></i> Thu hồi</button>` : ""
            ].join("");

            row.innerHTML = `
                <div class="msg-wrap">
                    <div class="msg-actions">
                        <button type="button" title="Trả lời" onclick="alert('Reply sẽ có ở Phase 2')"><i class="fa-solid fa-quote-left"></i></button>
                        <button type="button" title="Chuyển tiếp" onclick="alert('Forward sẽ có ở Phase 2')"><i class="fa-solid fa-share"></i></button>
                        <button type="button" title="Thêm" onclick="toggleMore(event, '${dto.id}')"><i class="fa-solid fa-ellipsis"></i></button>
                        <div class="more-menu" id="menu-${dto.id}">${moreItems}</div>
                    </div>
                    <div class="bubble">
                        ${mediaHtml}
                        ${escapeHtml(dto.content || "")}
                    </div>
                    ${reactionHtml}
                    <div class="msg-meta">${metaBits}</div>
                </div>`;
        }

        if (existing) existing.replaceWith(row);
        else {
            messagesList.appendChild(row);
            messagesList.scrollTop = messagesList.scrollHeight;
        }
    }

    window.toggleMore = function (e, id) {
        e.stopPropagation();
        const menu = document.getElementById(`menu-${id}`);
        const wasOpen = menu?.classList.contains("open");
        closeAllMenus();
        if (menu && !wasOpen) menu.classList.add("open");
    };
    document.addEventListener("click", closeAllMenus);

    window.editMsg = async function (id) {
        const text = prompt("Nội dung mới:");
        if (!text) return;
        await connection.invoke("EditMessage", { messageId: id, userId: currentUserId, newContent: text });
    };
    window.deleteMsg = async function (id) {
        if (!confirm("Thu hồi tin nhắn cho mọi người?")) return;
        await connection.invoke("DeleteMessage", { messageId: id, userId: currentUserId });
    };
    window.pinMsg = async function (id, isPinned) {
        await connection.invoke("PinMessage", { messageId: id, userId: currentUserId, isPinned });
    };
    window.reactMsg = async function (id, emotion) {
        await connection.invoke("AddReaction", { messageId: id, userId: currentUserId, emotion });
    };

    document.getElementById("btnConnect").addEventListener("click", async () => {
        const userId = senderIdInput.value.trim();
        if (!userId) {
            loginError.innerText = "Vui lòng nhập User ID!";
            loginError.style.display = "block";
            return;
        }
        currentUserId = userId;
        document.getElementById("navAvatar").textContent = (userId[0] || "U").toUpperCase();
        try {
            await connection.start();
            loadInbox();
            loginOverlay.style.opacity = "0";
            setTimeout(() => loginOverlay.style.display = "none", 250);
        } catch (err) {
            loginError.innerText = "Lỗi kết nối SignalR: " + err;
            loginError.style.display = "block";
        }
    });

    async function loadInbox() {
        const res = await fetch(`/api/conversations/inbox/${currentUserId}`);
        const data = await res.json();
        chatList.innerHTML = "";
        data.forEach(chat => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = `chat-item ${chat.conversationId === currentConversationId ? "active" : ""}`;
            btn.innerHTML = `
                <div class="avatar"><i class="fa-solid ${chat.type === 1 ? "fa-user-group" : "fa-user"}"></i></div>
                <div class="chat-item-info">
                    <div class="chat-item-top">
                        <h6>${escapeHtml(chat.title || "Chat")}</h6>
                        <span class="chat-time"></span>
                    </div>
                    <p>${escapeHtml(chat.lastMessage || "")}</p>
                </div>`;
            btn.onclick = () => selectChat(chat.conversationId, chat.title);
            chatList.appendChild(btn);
        });
    }

    async function selectChat(convId, title) {
        currentConversationId = convId;
        currentChatTitle.innerText = title || "Trò chuyện";
        txtMessage.placeholder = `Nhập @, tin nhắn tới ${title || "hội thoại"}`;
        mainChatArea.classList.add("visible");
        emptyState.style.display = "none";
        chatActive.style.display = "flex";
        messagesList.innerHTML = "";

        await connection.invoke("JoinChatRoom", convId);
        const res = await fetch(`/api/messages/${convId}`);
        const messages = await res.json();
        messages.forEach(m => upsertMessage(m));
        loadInbox();
    }

    async function uploadAndSend(file, messageType) {
        const formData = new FormData();
        formData.append("file", file);
        const res = await fetch("/api/attachments/upload", { method: "POST", body: formData });
        const data = await res.json();
        await connection.invoke("SendMessage", {
            conversationId: currentConversationId,
            senderId: currentUserId,
            messageType,
            content: messageType === 2 ? "Đã gửi một hình ảnh" : "Đã gửi một file đính kèm",
            attachmentUrl: data.url,
            attachmentName: data.originalName
        });
    }

    btnAttach.addEventListener("click", () => fileInput.click());
    btnImage.addEventListener("click", () => imageInput.click());
    fileInput.addEventListener("change", async function () {
        if (!this.files.length) return;
        try { await uploadAndSend(this.files[0], 1); } catch (err) { alert("Lỗi upload file: " + err); }
        this.value = "";
    });
    imageInput.addEventListener("change", async function () {
        if (!this.files.length) return;
        try { await uploadAndSend(this.files[0], 2); } catch (err) { alert("Lỗi upload ảnh: " + err); }
        this.value = "";
    });

    async function sendText(content) {
        if (!content || !currentConversationId) return;
        await connection.invoke("SendMessage", {
            conversationId: currentConversationId,
            senderId: currentUserId,
            messageType: 0,
            content
        });
        txtMessage.value = "";
        updateComposerMode();
    }

    btnSend.addEventListener("click", () => sendText(txtMessage.value.trim()));
    btnLike.addEventListener("click", () => sendText("👍"));
    txtMessage.addEventListener("input", updateComposerMode);
    txtMessage.addEventListener("keypress", (e) => { if (e.key === "Enter") btnSend.click(); });

    function showCallOverlay(status, details, iconClass, buttonsHtml) {
        callStatusText.innerText = status;
        callDetailsText.innerText = details;
        callIcon.innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
        callActionButtons.innerHTML = buttonsHtml;
        callOverlay.style.display = "flex";
        callIcon.style.animation = status.includes("đang diễn ra") ? "none" : "pulse 1.5s infinite";
    }

    function cleanupCall() {
        callOverlay.style.display = "none";
        currentCallId = null;
        pendingOffer = null;
        pendingCandidates = [];
        clearInterval(callTimerInterval);
        if (peerConnection) { peerConnection.close(); peerConnection = null; }
        if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
        localVideo.style.display = "none";
        remoteVideo.style.display = "none";
        localVideo.srcObject = null;
        remoteVideo.srcObject = null;
    }

    async function initWebRTC(isVideo) {
        peerConnection = new RTCPeerConnection(rtcConfig);
        peerConnection.onicecandidate = event => {
            if (event.candidate && currentConversationId) {
                connection.invoke("SendWebRTCSignal", currentConversationId, JSON.stringify({ candidate: event.candidate }));
            }
        };
        peerConnection.ontrack = event => {
            remoteVideo.style.display = "block";
            remoteVideo.srcObject = event.streams[0];
        };
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo });
            if (isVideo) {
                localVideo.style.display = "block";
                localVideo.srcObject = localStream;
            }
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        } catch (e) {
            alert("Không thể truy cập Camera/Microphone.");
        }
    }

    async function startCall(isVideo) {
        if (!currentConversationId) return;
        currentCallType = isVideo ? 1 : 0;
        await initWebRTC(isVideo);
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        await connection.invoke("InitiateCall", {
            conversationId: currentConversationId,
            callerId: currentUserId,
            type: currentCallType
        });
        setTimeout(() => {
            connection.invoke("SendWebRTCSignal", currentConversationId, JSON.stringify({ sdp: peerConnection.localDescription }));
        }, 500);
        showCallOverlay(
            isVideo ? "Đang gọi Video..." : "Đang gọi đi...",
            currentChatTitle.innerText,
            isVideo ? "fa-video" : "fa-phone",
            `<button class="call-btn end" onclick="endCall()"><i class="fa-solid fa-phone-slash"></i></button>`
        );
    }

    document.getElementById("btnCallAudio").addEventListener("click", () => startCall(false));
    document.getElementById("btnCallVideo").addEventListener("click", () => startCall(true));

    connection.on("CallInitiated", (callId) => { currentCallId = callId; });
    connection.on("IncomingCall", (callInfo) => {
        if (callInfo.callerId === currentUserId) return;
        currentCallId = callInfo.callId;
        currentCallType = callInfo.type;
        const isVideo = currentCallType === 1;
        showCallOverlay(
            isVideo ? "Cuộc gọi Video đến" : "Cuộc gọi Audio đến",
            "Từ: " + currentChatTitle.innerText,
            isVideo ? "fa-video" : "fa-phone",
            `<button class="call-btn accept" onclick="acceptCall()"><i class="fa-solid fa-phone"></i></button>
             <button class="call-btn reject" onclick="rejectCall()"><i class="fa-solid fa-phone-slash"></i></button>`
        );
    });
    connection.on("CallAccepted", (callId) => { if (currentCallId === callId) startTimer(); });
    connection.on("CallRejected", (callId) => { if (currentCallId === callId) { cleanupCall(); alert("Cuộc gọi bị từ chối"); } });
    connection.on("CallEnded", (callId) => { if (currentCallId === callId) cleanupCall(); });

    connection.on("ReceiveWebRTCSignal", async (payloadStr) => {
        const message = JSON.parse(payloadStr);
        if (!peerConnection) {
            if (message.sdp && message.sdp.type === "offer") pendingOffer = message.sdp;
            else if (message.candidate) pendingCandidates.push(message.candidate);
            return;
        }
        await processWebRTCSignal(message);
    });

    async function processWebRTCSignal(message) {
        if (message.sdp) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(message.sdp));
            if (message.sdp.type === "offer") {
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                connection.invoke("SendWebRTCSignal", currentConversationId, JSON.stringify({ sdp: peerConnection.localDescription }));
            }
        } else if (message.candidate) {
            await peerConnection.addIceCandidate(new RTCIceCandidate(message.candidate));
        }
    }

    window.acceptCall = async function () {
        if (!currentCallId) return;
        await initWebRTC(currentCallType === 1);
        if (pendingOffer) {
            await processWebRTCSignal({ sdp: pendingOffer });
            pendingOffer = null;
            for (const c of pendingCandidates) await processWebRTCSignal({ candidate: c });
            pendingCandidates = [];
        }
        await connection.invoke("AcceptCall", currentCallId, currentConversationId);
        startTimer();
    };
    window.rejectCall = async function () {
        if (!currentCallId) return;
        await connection.invoke("RejectCall", currentCallId, currentConversationId);
        cleanupCall();
    };
    window.endCall = async function () {
        if (currentCallId) await connection.invoke("EndCall", currentCallId, currentConversationId);
        cleanupCall();
    };

    function startTimer() {
        showCallOverlay(
            "Cuộc gọi đang diễn ra...",
            "00:00",
            "fa-headset",
            `<button class="call-btn end" onclick="endCall()"><i class="fa-solid fa-phone-slash"></i></button>`
        );
        callSeconds = 0;
        callDetailsText.innerText = "00:00";
        clearInterval(callTimerInterval);
        callTimerInterval = setInterval(() => {
            callSeconds++;
            callDetailsText.innerText = formatDuration(callSeconds);
        }, 1000);
    }
</script>
</body>
</html>
